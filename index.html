<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d0c">
<title>Sweat With Wilk</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" defer></script>
</head>
<body>
<header class="app-header">
  <div class="brand">
    <div class="brand-name">SWEAT WITH WILK</div>
    <div class="brand-tag">Sweat your ticket, play by play.</div>
  </div>
  <button id="alerts-bell" class="icon-btn" aria-label="Alerts" hidden>
    🔔<span id="alerts-badge" class="badge" hidden>0</span>
  </button>
</header>

<main id="main">
  <section id="view-tickets" class="view"></section>
  <section id="view-scores" class="view" hidden></section>
  <section id="view-props" class="view" hidden></section>
  <section id="view-news" class="view" hidden></section>
  <section id="view-community" class="view" hidden></section>
  <section id="view-board" class="view" hidden></section>
  <section id="view-bankroll" class="view" hidden></section>
  <section id="view-account" class="view" hidden></section>
  <section id="view-more" class="view" hidden>
    <h2>More</h2>
    <button class="more-row" onclick="showView('props')"><span class="more-ico">🎯</span><span class="more-txt"><span class="more-t">Props</span><span class="more-s">Your prop legs, live + today's prop plays</span></span><span class="more-arrow">›</span></button>
    <button class="more-row" onclick="showView('news')"><span class="more-ico">📰</span><span class="more-txt"><span class="more-t">News</span><span class="more-s">Headlines by league</span></span><span class="more-arrow">›</span></button>
    <button class="more-row" onclick="showView('bankroll')"><span class="more-ico">💰</span><span class="more-txt"><span class="more-t">Bankroll</span><span class="more-s">Your money tracker</span></span><span class="more-arrow">›</span></button>
    <button class="more-row" onclick="showView('account')"><span class="more-ico">👤</span><span class="more-txt"><span class="more-t">Account</span><span class="more-s">Profile, alerts + push settings</span></span><span class="more-arrow">›</span></button>
  </section>
</main>

<div id="sheet-root"></div>
<div id="toast-root"></div>

<nav class="bottom-nav">
  <button data-nav="tickets" class="nav-btn active"><span class="nav-ico">🎟️</span><span>Tickets</span></button>
  <button data-nav="scores" class="nav-btn"><span class="nav-ico">📊</span><span>Scores</span></button>
  <button data-nav="board" class="nav-btn"><span class="nav-ico">📋</span><span>Board</span></button>
  <button data-nav="community" class="nav-btn"><span class="nav-ico">💬</span><span>Community</span></button>
  <button data-nav="more" class="nav-btn"><span class="nav-ico">☰</span><span>More</span></button>
</nav>

<script src="/app.js"></script>
<script>
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js').catch(() => {}); }
</script>
</body>
</html>
